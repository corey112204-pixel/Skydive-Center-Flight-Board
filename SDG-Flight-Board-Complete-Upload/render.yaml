services:
  - type: web
    name: sdg-flight-operations
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npx --yes pnpm@11.19.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.19.0 build
    startCommand: node web-server.mjs
    healthCheckPath: /health
    disk:
      name: sdg-operations-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: SDG_DB_PATH
        value: /var/data/sdg-operations.sqlite
      - key: SDG_INITIAL_ADMIN_PASSWORD
        sync: false
